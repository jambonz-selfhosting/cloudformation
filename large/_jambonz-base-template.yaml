###########################################
#
#      Recording server cluster
#
###########################################   
  RecordingALBSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupName: !Sub '${AWS::StackName}-recording-alb-sg'
        GroupDescription: !Sub 'Security group for ${AWS::StackName} Recording Server ALB'
        VpcId: !Ref VPC
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            SourceSecurityGroupId: !Ref FeatureServerSecurityGroup
            Description: Allow HTTP from feature servers only
        SecurityGroupEgress:
          - IpProtocol: -1
            FromPort: 0
            ToPort: 0
            CidrIp: 0.0.0.0/0    
        Tags:
          - Key: Name
            Value: !Sub '${AWS::StackName}-recording-alb-sg'

  RecordingInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-recording-instance-sg'
      GroupDescription: !Sub 'Security group for ${AWS::StackName} Recording Server instances'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref RecordingALBSecurityGroup
          Description: Allow traffic from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0    
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-recording-instance-sg'

  RecordingInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RecordingIamRole

  RecordingLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-recording-launch-template"
      LaunchTemplateData:
        # IMDSv2 only: a customer-reachable SSRF (webhook, bucket endpoint) can then
        # never read the instance role's credentials from 169.254.169.254.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        ImageId: !FindInMap [ "Arch2AMI", !Ref Architecture, "RecordingServerAmi"]
        InstanceType: !If
          - UseDefaultRecordingInstanceType
          - !FindInMap [ArchInstanceTypeDefaults, !Ref Architecture, RecordingServerDefault]
          - !Ref RecordingInstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Name: !Ref RecordingInstanceProfile
        SecurityGroupIds:
          - !Ref RecordingInstanceSecurityGroup
          - !Ref SshSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Encrypted: !If [EnableEBSEncryptionCondition, true, false]
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                # Set default user based on OS
                if grep -q 'ID="rhel"' /etc/os-release; then
                    DEFAULT_USER=ec2-user
                else
                    DEFAULT_USER=admin
                fi

                # Sync SSH keys from default user to jambonz user
                echo "Syncing SSH keys to jambonz user..."
                if [ -f "/home/$DEFAULT_USER/.ssh/authorized_keys" ] && [ -s "/home/$DEFAULT_USER/.ssh/authorized_keys" ]; then
                    mkdir -p /home/jambonz/.ssh
                    cp "/home/$DEFAULT_USER/.ssh/authorized_keys" /home/jambonz/.ssh/
                    chown -R jambonz:jambonz /home/jambonz/.ssh
                    chmod 700 /home/jambonz/.ssh
                    chmod 600 /home/jambonz/.ssh/authorized_keys
                    echo "SSH keys copied from $DEFAULT_USER to jambonz"
                else
                    echo "Warning: No SSH keys found for $DEFAULT_USER"
                fi

                # configure upload_recordings service
                echo "Configuring upload_recordings service"
                sudo sed -i -e "s/MYSQL_HOST=/MYSQL_HOST=${JAMBONES_MYSQL_HOST}/g" /etc/systemd/system/upload_recordings.service
                sudo sed -i -e "s/MYSQL_USER=/MYSQL_USER=${JAMBONES_MYSQL_USER}/g" /etc/systemd/system/upload_recordings.service
                sudo sed -i -e "s/MYSQL_DATABASE=/MYSQL_DATABASE=jambones/g" /etc/systemd/system/upload_recordings.service
                sudo sed -i -e "s/BASIC_AUTH_USERNAME=/BASIC_AUTH_USERNAME=jambonz/g" /etc/systemd/system/upload_recordings.service
                sudo sed -i -e "s/--port 3017/--port 3000/g" /etc/systemd/system/upload_recordings.service

                # Insert the LD_LIBRARY_PATH environment variable into the [Service] section
                sudo sed -i '/\[Service\]/a Environment=LD_LIBRARY_PATH=\/usr\/local\/lib' /etc/systemd/system/upload_recordings.service

                # Secrets stay out of the unit file: this installs a drop-in that fetches them
                # from Parameter Store into a root-only file on tmpfs at every service start.
                sudo /opt/jambonz/apply-ssm-secrets.sh \
                  "/jambonz/${AWS::StackName}/common,/jambonz/${AWS::StackName}/recording" ${AWS_REGION} \
                  /home/jambonz/apps/ecosystem.config.js "ENCRYPTION_SECRET MYSQL_PASSWORD BASIC_AUTH_PASSWORD" || exit 1

                sudo systemctl daemon-reload
                sudo systemctl enable upload_recordings
                sudo systemctl start upload_recordings

                echo "JAMBONES_INFLUX_URL=http://${MONITORING_SERVER_IP}:8086" | sudo tee -a /etc/default/telegraf > /dev/null
                sudo systemctl restart telegraf


              - JAMBONES_MYSQL_HOST: !GetAtt DatabaseCluster.ReadEndpoint.Address
                JAMBONES_MYSQL_USER: !Ref MySQLUsername
                MONITORING_SERVER_IP: !GetAtt MonitoringServerEC2.PrivateIp
                AWS_REGION: !Ref AWS::Region

  RecordingApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Subnets: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref RecordingALBSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "4000"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-recording-alb"

  RecordingTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckProtocol: HTTP
      HealthCheckPort: "3000"
      HealthCheckPath: "/health"
      TargetType: instance
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-recording-tg"

  RecordingALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref RecordingTargetGroup
      LoadBalancerArn: !Ref RecordingApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  RecordingAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: SsmSecrets
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-recording-asg"
      VPCZoneIdentifier: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref RecordingLaunchTemplate
        Version: !GetAtt RecordingLaunchTemplate.LatestVersionNumber
      MinSize: 1
      MaxSize: 8
      DesiredCapacity: '1'
      TargetGroupARNs:
        - !Ref RecordingTargetGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-recording-instance"
          PropagateAtLaunch: true
        - Key: AutoScaling
          Value: "true"
          PropagateAtLaunch: true

###########################################
#
#      Aurora RDS Database
#
###########################################   
  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: !Sub '${AWS::StackName}-aurora-mysql-instance-params'
      Description: Custom parameter group for Aurora MySQL instance
      Family: aurora-mysql8.0
      Parameters:
        max_connections: 500
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-instance-parameter-group'

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${AWS::StackName}-aurora-mysql-subnetgroup'
      DBSubnetGroupDescription: CloudFormation managed DB subnet group.
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub '${AWS::StackName}-aurora-mysql-cluster'
      Engine: aurora-mysql
      EngineVersion: "8.0.mysql_aurora.3.04.0"
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraDBMinCapacity
        MaxCapacity: !Ref AuroraDBMaxCapacity
      MasterUsername: !Ref MySQLUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbPasswordSecret}}}'
      DatabaseName: 'jambones'
      BackupRetentionPeriod: 5
      PreferredBackupWindow: 07:00-09:00
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref MySQLSecurityGroup
      DeletionProtection: true

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-mysql
      DBParameterGroupName: !Ref DatabaseParameterGroup
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-aurora-instance'

###########################################
#
#      ElastiCache Redis
#
###########################################           
  ElastiCacheSubnetGroup:
    Type: 'AWS::ElastiCache::SubnetGroup'
    Properties:
      CacheSubnetGroupName: !Sub '${AWS::StackName}-cache-subnetgroup'
      Description: !Sub '${AWS::StackName} Subnet Group'
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  ElastiCacheParameterGroup:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: redis7
      Description: "Custom parameter group for Redis 7.1"
      Properties:
        maxmemory-policy: allkeys-lru

  ElastiCacheCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref ElastiCacheNodeType
      ClusterName : !Sub '${AWS::StackName}-redis'
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref ElastiCacheSubnetGroup
      CacheParameterGroupName: !Ref ElastiCacheParameterGroup
      VpcSecurityGroupIds:
        - !GetAtt RedisSecurityGroup.GroupId
      Port: 6379
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-redis'

###########################################
#
#      Monitoring Instance
#
###########################################
      
  MonitoringServerEC2:
    Type: 'AWS::EC2::Instance'
    Properties:
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      SubnetId: !Ref PublicSubnet1
      ImageId: !FindInMap [ "Arch2AMI", !Ref Architecture, "MonitoringServerAmi"]
      InstanceType: !If
        - UseDefaultMonitoringServerInstanceType
        - !FindInMap [ArchInstanceTypeDefaults, !Ref Architecture, MonitoringServerDefault]
        - !Ref InstanceTypeMonitoringServer
      SecurityGroupIds:
        - Ref: SshSecurityGroup
        - Ref: MonitoringSecurityGroup
      KeyName: !Ref KeyName
      Monitoring: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref WebMonitoringDiskSize
            VolumeType: gp3
            Encrypted: !If [EnableEBSEncryptionCondition, true, false]
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash -xe
              # restart heplify-server
              sudo systemctl restart heplify-server.service

              # Handle OpenTelemetry services
              if [[ "${EnableOpenTelemetry}" == "true" ]]; then
                echo "OpenTelemetry enabled - starting Cassandra and Jaeger"
                sudo systemctl restart cassandra.service
                sleep 60
                sudo systemctl restart jaeger-collector.service
                sudo systemctl restart jaeger-query.service
              else
                echo "OpenTelemetry disabled - disabling Cassandra and Jaeger services"
                sudo systemctl stop cassandra.service || true
                sudo systemctl disable cassandra.service
                sudo systemctl stop jaeger-collector.service || true
                sudo systemctl disable jaeger-collector.service
                sudo systemctl stop jaeger-query.service || true
                sudo systemctl disable jaeger-query.service
              fi
            - EnableOpenTelemetry: !Ref EnableOpenTelemetry
      Tags:
        -
          Key: Name
          Value: !Sub '${AWS::StackName}-monitoring-server'
                    

###########################################
#      New SBC SIP instances
#      Create a couple of EIPs for SBC SIP Servers, and tag them as such
#      Note: devops can create more EIPs later, the Environment tag
#      is what caused them to get associated when sip servers scale.
#      The idea is simply to have a pre-allocated set of N EIPs
#      for sip signaling so these can be whitelisted with carriers
###########################################           
  SbcSipEIP1:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        -
          Key: Environment
          Value: !Sub '${AWS::StackName}-sbc-sip'
        -
          Key: Name
          Value: !Sub '${AWS::StackName}-sbc-sip-1'

 # --- SIP server EC2 IAM role
  SbcSipIamRole:
    Type: AWS::IAM::Role
    Properties:
      Description: jambonz SBC SIP servers
      RoleName: !Sub '${AWS::StackName}-sbc-sip-ec2-role'
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [ec2.amazonaws.com]
          Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - !Ref InstanceAgentPolicy
      Policies:
        - PolicyName: jambonz
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # scale-in drain (inbound): finds its own ASG and terminate hook at startup and
              # completes the hook once its calls have ended. Describe actions have no
              # resource-level permissions; DescribeAutoScalingGroups serves the SIGHUP status dump.
              - Effect: Allow
                Action:
                  - 'autoscaling:DescribeAutoScalingInstances'
                  - 'autoscaling:DescribeLifecycleHooks'
                  - 'autoscaling:DescribeAutoScalingGroups'
                Resource: '*'
              - Effect: Allow
                Action: 'autoscaling:CompleteLifecycleAction'
                Resource: !Sub 'arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-sbc-sip-autoscaling-group'
              # Elastic IP (auto-assign-elastic-ip.sh): claim a free EIP tagged with this tier's
              # Environment. Association is allowed only when the EIP and the instance both carry it.
              - Effect: Allow
                Action: 'ec2:DescribeAddresses'
                Resource: '*'
              - Effect: Allow
                Action: 'ec2:AssociateAddress'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/Environment': !Sub '${AWS::StackName}-sbc-sip'
              # the jambonz secrets (see SsmSecrets): the SIP tier reads common
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParametersByPath'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/common'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/common/*'

  # --- SIP server EC2 Role Instance profile
  SbcSipInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      InstanceProfileName:  !Sub '${AWS::StackName}-sbc-sip-ec2-role'
      Path: /
      Roles:
        - !Ref SbcSipIamRole

  MyPlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Properties:
      Strategy: spread

  SbcSipLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only: a customer-reachable SSRF (webhook, bucket endpoint) can then
        # never read the instance role's credentials from 169.254.169.254.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        ImageId: !FindInMap [ "Arch2AMI", !Ref Architecture, "SbcSipAmi"]
        InstanceType: !If
          - UseDefaultSbcSipInstanceType
          - !FindInMap [ArchInstanceTypeDefaults, !Ref Architecture, SbcSipDefault]
          - !Ref InstanceTypeSbcSip
        Placement:
          GroupName: !Ref MyPlacementGroup
        IamInstanceProfile:
          Name: !Ref SbcSipInstanceProfile
        KeyName: !Ref KeyName
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            Groups:
              - Ref: SshSecurityGroup
              - Ref: SbcSipSecurityGroup
            DeviceIndex: 0
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Encrypted: !If [EnableEBSEncryptionCondition, true, false]
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                echo "running jambonz user data script"

                # Detecting the Linux distribution
                if grep -q 'ID="rhel"' /etc/os-release; then
                    DEFAULT_USER=ec2-user

                    echo disabling firewalld
                    sudo systemctl stop firewalld
                    sudo systemctl disable firewalld
                else
                    DEFAULT_USER=admin
                fi

                # Always use jambonz user for apps
                USER=jambonz
                HOME=/home/jambonz

                # Sync SSH keys from default user to jambonz user
                echo "Syncing SSH keys to jambonz user..."
                if [ -f "/home/$DEFAULT_USER/.ssh/authorized_keys" ] && [ -s "/home/$DEFAULT_USER/.ssh/authorized_keys" ]; then
                    mkdir -p /home/jambonz/.ssh
                    cp "/home/$DEFAULT_USER/.ssh/authorized_keys" /home/jambonz/.ssh/
                    chown -R jambonz:jambonz /home/jambonz/.ssh
                    chmod 700 /home/jambonz/.ssh
                    chmod 600 /home/jambonz/.ssh/authorized_keys
                    echo "SSH keys copied from $DEFAULT_USER to jambonz"
                else
                    echo "Warning: No SSH keys found for $DEFAULT_USER"
                fi

                if [ -f "/usr/local/bin/auto-assign-elastic-ip.sh" ]; then
                    IMDS_TOKEN="$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")"
                    PRE_PUBLIC_IP=`curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4`
                    echo "before retrieving EIP for SIP server, public IP is $PRE_PUBLIC_IP"

                    /usr/local/bin/auto-assign-elastic-ip.sh
                    sleep 20

                    PUBLIC_IP=`curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4`
                    echo "after retrieving EIP for SIP server, public IP is $PUBLIC_IP"
                else
                    echo "Warning: /usr/local/bin/auto-assign-elastic-ip.sh not found, skipping EIP assignment"
                fi

                # configure drachtio service
                sudo sed -i -e "s/MYSQL_HOST=/MYSQL_HOST=${JAMBONES_MYSQL_HOST}/g" /etc/systemd/system/drachtio.service
                sudo sed -i -e "s/MYSQL_USER=/MYSQL_USER=${JAMBONES_MYSQL_USER}/g" /etc/systemd/system/drachtio.service
                sudo sed -i -e "s/MYSQL_DATABASE=/MYSQL_DATABASE=jambones/g" /etc/systemd/system/drachtio.service
                sudo sed -i -e "s/JAMBONES_REDIS_HOST=/JAMBONES_REDIS_HOST=${JAMBONES_REDIS_HOST}/g" /etc/systemd/system/drachtio.service
                sudo sed -i -e "s/JAMBONES_REDIS_PORT=/JAMBONES_REDIS_PORT=6379/g" /etc/systemd/system/drachtio.service

                # drachtio reads the database password (license validation) from its environment.
                # This drop-in fetches it from Parameter Store at every start into a root-only file
                # on tmpfs, so it never sits in the world-readable unit file. EnvironmentFile
                # overrides the unit's empty Environment= line; its leading '-' is required because
                # systemd loads it before ExecStartPre has created it. ($$ is systemd for a literal $.)
                sudo mkdir -p /etc/systemd/system/drachtio.service.d
                sudo tee /etc/systemd/system/drachtio.service.d/ssm-env.conf > /dev/null << 'DROPIN'
                [Service]
                ExecStartPre=/bin/sh -c 'umask 077; mkdir -p /run/jambonz; v=$$(aws ssm get-parameter --region ${AWS_REGION} --with-decryption --name /jambonz/${AWS::StackName}/common/JAMBONES_MYSQL_PASSWORD --query Parameter.Value --output text) && echo "JAMBONES_MYSQL_PASSWORD=$$v" > /run/jambonz/drachtio.env'
                EnvironmentFile=-/run/jambonz/drachtio.env
                DROPIN

                echo "writing $HOME/apps/ecosystem.config.js.."
                cat << EOF > $HOME/apps/ecosystem.config.js
                module.exports = {
                  apps : [
                  {
                    name: 'sbc-sip-sidecar',
                    cwd: '$HOME/apps/sbc-sip-sidecar',
                    script: 'app.js',
                    instance_var: 'INSTANCE_ID',
                    out_file: '$HOME/.pm2/logs/sbc-sip-sidecar.log',
                    err_file: '$HOME/.pm2/logs/sbc-sip-sidecar.log',
                    merge_logs: true,
                    exec_mode: 'fork',
                    instances: 1,
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '2G',
                    node_args: [],
                    env: {
                      JAMBONES_LOGLEVEL: 'info',
                      JAMBONES_SERVER_CONTROL: 1,
                      RTPENGINE_PING_INTERVAL: 30000,
                      DRACHTIO_HOST: '127.0.0.1',
                      DRACHTIO_PORT: 9022,
                      DRACHTIO_SECRET: 'cymru',
                      AWS_LIFECYCLE_DRAIN: 1,
                      JAMBONES_MYSQL_REFRESH_TTL: ${DbCachingTTS},
                      JAMBONES_MYSQL_WRITE_HOST: '${JAMBONES_MYSQL_WRITE_HOST}',
                      JAMBONES_MYSQL_WRITE_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_WRITE_DATABASE: 'jambones',
                      JAMBONES_MYSQL_HOST: '${JAMBONES_MYSQL_HOST}',
                      JAMBONES_MYSQL_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_DATABASE: 'jambones',
                      JAMBONES_MYSQL_CONNECTION_LIMIT: 5,
                      JAMBONES_REDIS_HOST: '${JAMBONES_REDIS_HOST}',
                      JAMBONES_REDIS_PORT: 6379,
                      JAMBONES_TIME_SERIES_HOST: '${JAMBONES_TIME_SERIES_HOST}',
                      ENABLE_METRICS: 1,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_TELEGRAF: 1,
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      JAMBONES_NETWORK_CIDR: '${VPC_CIDR}'
                    }
                  },
                  {
                    name: 'sbc-call-router',
                    cwd: '$HOME/apps/sbc-call-router',
                    script: 'app.js',
                    instance_var: 'INSTANCE_ID',
                    out_file: '$HOME/.pm2/logs/sbc-call-router.log',
                    err_file: '$HOME/.pm2/logs/sbc-call-router.log',
                    merge_logs: true,
                    exec_mode: 'fork',
                    instances: 1,
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '1G',
                    env: {
                      JAMBONES_LOGLEVEL: 'info',
                      HTTP_PORT:  4000,
                      JAMBONES_INBOUND_ROUTE: '127.0.0.1:4002',
                      JAMBONES_OUTBOUND_ROUTE: '127.0.0.1:4003',
                      JAMBONZ_TAGGED_INBOUND: 1,
                      ENABLE_METRICS: 1,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_TELEGRAF: 1,
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      JAMBONES_NETWORK_CIDR: '${VPC_CIDR}'
                    }
                  },
                  {
                    name: 'outbound',
                    cwd: '$HOME/apps/outbound',
                    script: 'app.js',
                    instance_var: 'INSTANCE_ID',
                    out_file: '$HOME/.pm2/logs/outbound.log',
                    err_file: '$HOME/.pm2/logs/outbound.log',
                    exec_mode: 'fork',
                    instances: 1,
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '3G',
                    node_args: [],
                    env: {
                      JAMBONES_LOGLEVEL: 'info',
                      JAMBONES_NETWORK_CIDR: '${VPC_CIDR}',
                      JAMBONES_RTPENGINE_INJECT_DTMF_ALWAYS: 0,
                      JAMBONES_RTPENGINE_UDP_PORT: 6000,
                      MIN_CALL_LIMIT: 9999,
                      RTPENGINE_PING_INTERVAL: 30000,
                      DRACHTIO_HOST: '127.0.0.1',
                      DRACHTIO_PORT: 9022,
                      DRACHTIO_SECRET: 'cymru',
                      JAMBONES_MYSQL_REFRESH_TTL: ${DbCachingTTS},
                      JAMBONES_MYSQL_HOST: '${JAMBONES_MYSQL_HOST}',
                      JAMBONES_MYSQL_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_DATABASE: 'jambones',
                      JAMBONES_MYSQL_CONNECTION_LIMIT: 10,
                      JAMBONES_REDIS_HOST: '${JAMBONES_REDIS_HOST}',
                      JAMBONES_REDIS_PORT: 6379,
                      JAMBONES_TIME_SERIES_HOST: '${JAMBONES_TIME_SERIES_HOST}',
                      JAMBONES_TRACK_ACCOUNT_CALLS: 0,
                      JAMBONES_TRACK_SP_CALLS: 0,
                      JAMBONES_TRACK_APP_CALLS: 0,
                      ENABLE_METRICS: 1,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      STATS_TELEGRAF: 1
                    }
                  },
                  {
                    name: 'inbound',
                    cwd: '$HOME/apps/inbound',
                    script: 'app.js',
                    instance_var: 'INSTANCE_ID',
                    out_file: '$HOME/.pm2/logs/inbound.log',
                    err_file: '$HOME/.pm2/logs/inbound.log',
                    exec_mode: 'fork',
                    instances: 'max',
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '3G',
                    node_args: [],
                    env: {
                      JAMBONES_LOGLEVEL: 'info',
                      JAMBONES_SERVER_CONTROL: 1,
                      AWS_REGION: '${AWS_REGION}',
                      JAMBONES_NETWORK_CIDR: '${VPC_CIDR}',
                      JAMBONES_RTPENGINE_INJECT_DTMF_ALWAYS: 0,
                      JAMBONES_RTPENGINE_UDP_PORT: 7000,
                      DRACHTIO_HOST: '127.0.0.1',
                      DRACHTIO_PORT: 9022,
                      DRACHTIO_SECRET: 'cymru',
                      AWS_LIFECYCLE_DRAIN: 1,
                      HTTP_PORT: 3000,
                      HTTP_PORT_MAX: 3009,
                      JAMBONES_MYSQL_REFRESH_TTL: ${DbCachingTTS},
                      JAMBONES_MYSQL_WRITE_HOST: '${JAMBONES_MYSQL_WRITE_HOST}',
                      JAMBONES_MYSQL_WRITE_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_WRITE_DATABASE: 'jambones',
                      JAMBONES_MYSQL_HOST: '${JAMBONES_MYSQL_HOST}',
                      JAMBONES_MYSQL_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_DATABASE: 'jambones',
                      JAMBONES_MYSQL_CONNECTION_LIMIT: 10,
                      JAMBONES_REDIS_HOST: '${JAMBONES_REDIS_HOST}',
                      JAMBONES_REDIS_PORT: 6379,
                      JAMBONES_TIME_SERIES_HOST: '${JAMBONES_TIME_SERIES_HOST}',
                      ENABLE_METRICS: 1,
                      JAMBONES_TRACK_ACCOUNT_CALLS: 0,
                      JAMBONES_TRACK_SP_CALLS: 0,
                      JAMBONES_TRACK_APP_CALLS: 0,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_TELEGRAF: 1,
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      MS_TEAMS_SIP_PROXY_IPS: '52.114.148.0, 52.114.132.46, 52.114.75.24, 52.114.76.76, 52.114.7.24, 52.114.14.70'
                    }
                  }
                  ]
                };
                EOF
                echo "finished writing config file"

                echo "restarting telegraf"
                # point telegraf at the monitoring server's InfluxDB
                echo "JAMBONES_INFLUX_URL=http://${MONITORING_SERVER_IP}:8086" | sudo tee -a /etc/default/telegraf > /dev/null
                sudo systemctl restart telegraf

                if [[ "${EnablePcaps}" == "true" ]]; then
                  echo "enabling HEP and restarting drachtio server"
                  sudo sed -i -e "s/--port 9022/--port 9022 --homer ${MONITORING_SERVER_IP}:9060 --homer-id 10/g"  /etc/systemd/system/drachtio.service
                fi

                # the apps' secrets come from Parameter Store at every start (ssm-env preload)
                sudo /opt/jambonz/apply-ssm-secrets.sh "/jambonz/${AWS::StackName}/common" ${AWS_REGION} \
                  $HOME/apps/ecosystem.config.js "JWT_SECRET ENCRYPTION_SECRET JAMBONES_MYSQL_PASSWORD JAMBONES_MYSQL_WRITE_PASSWORD" || exit 1

                sudo systemctl daemon-reload
                sudo systemctl restart drachtio

                echo "starting jambonz apps"
                sudo -u $USER bash -c "pm2 restart $HOME/apps/ecosystem.config.js"
                sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
                sudo -u $USER bash -c "pm2 save"
                sudo systemctl enable pm2-$USER.service

                # enable cloudwatch
                if [[ ${CloudwatchLogRetention} -ne 0 ]]; then
                  echo "Enabling Cloudwatch for jambonz logs"
                  sudo sed -i -e "s/retention_in_days\": 3/retention_in_days\": ${CloudwatchLogRetention}/g" /opt/aws/amazon-cloudwatch-agent/bin/config.json 
                  sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json
                else
                  echo "Cloudwatch log retention is set to 0, disabling cloudwatch setup"
                  sudo systemctl stop amazon-cloudwatch-agent
                  sudo systemctl disable amazon-cloudwatch-agent
                fi

                # apiban SIP blocklist: install the customer's own key (ApibanKey parameter).
                # Without one the SBC runs without the blocklist and the 4-minute refresh cron is removed.
                if [ -n "${ApibanKey}" ]; then
                  echo "installing apiban key"
                  sudo sed -i -e "s|API-KEY-HERE|${ApibanKey}|g" /usr/local/bin/apiban/config.json
                  sudo /usr/local/bin/apiban/apiban-client-nftables FULL || echo "WARNING: apiban initial sync failed"
                else
                  echo "WARNING: no ApibanKey supplied; running without the apiban SIP blocklist"
                  sudo rm -f /etc/cron.d/apiban-client
                fi

                echo "user data script completed"
              - ApibanKey: !Ref ApibanKey
                VPC_CIDR: !Ref VpcCidr
                JAMBONES_MYSQL_HOST: !GetAtt DatabaseCluster.ReadEndpoint.Address
                JAMBONES_MYSQL_WRITE_HOST: !GetAtt DatabaseCluster.Endpoint.Address
                JAMBONES_MYSQL_USER: !Ref MySQLUsername
                JAMBONES_REDIS_HOST: !GetAtt ElastiCacheCluster.RedisEndpoint.Address
                JAMBONES_SAMPLE_RATE: !Ref StatsSampleRate
                MONITORING_SERVER_IP: !GetAtt MonitoringServerEC2.PrivateIp
                JAMBONES_TIME_SERIES_HOST: !GetAtt MonitoringServerEC2.PrivateIp
                AWS_REGION: !Ref AWS::Region
                CloudwatchLogRetention: !If [ShouldEnableCloudWatch, !Ref CloudwatchLogRetention, 0]
                DbCachingTTS: !Ref DbCachingTTS
                EnablePcaps: !Ref EnablePcaps

    
  SbcSipAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - DatabaseInstance 
      - ElastiCacheCluster
      - SbcSipEIP1
      - SsmSecrets
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-sbc-sip-autoscaling-group'
      LaunchTemplate:
        LaunchTemplateId: !Ref SbcSipLaunchTemplate
        Version: !GetAtt SbcSipLaunchTemplate.LatestVersionNumber
      MinSize: 0
      MaxSize: 4
      DesiredCapacity: 1
      TerminationPolicies:
       - OldestInstance
      VPCZoneIdentifier: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - 
          Key: Name
          Value: !Sub '${AWS::StackName}-sip-server'
          PropagateAtLaunch: 'true'
        - 
          Key: Environment
          Value: !Sub '${AWS::StackName}-sbc-sip'
          PropagateAtLaunch: 'true'

  SbcSipLifecycleHook: 
    Type: AWS::AutoScaling::LifecycleHook
    Properties:
      LifecycleHookName: !Sub '${AWS::StackName}-sip-scale-in'
      AutoScalingGroupName: !Ref SbcSipAutoScalingGroup
      LifecycleTransition: "autoscaling:EC2_INSTANCE_TERMINATING"


###########################################
#
#      Feature Instance
#
###########################################
  # --- Feature server EC2 IAM role
  FeatureServerIamRole:
    Type: AWS::IAM::Role
    Properties:
      Description: jambonz feature servers
      RoleName: !Sub '${AWS::StackName}-feature-server-ec2-role'
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [ec2.amazonaws.com]
          Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - !Ref InstanceAgentPolicy
      Policies:
        - PolicyName: jambonz
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # scale-in drain (feature-server): finds its own ASG and terminate hook at startup and
              # completes the hook once its calls have ended. Describe actions have no
              # resource-level permissions; DescribeAutoScalingGroups serves the SIGHUP status dump.
              - Effect: Allow
                Action:
                  - 'autoscaling:DescribeAutoScalingInstances'
                  - 'autoscaling:DescribeLifecycleHooks'
                  - 'autoscaling:DescribeAutoScalingGroups'
                Resource: '*'
              - Effect: Allow
                Action: 'autoscaling:CompleteLifecycleAction'
                Resource: !Sub 'arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-feature-server-autoscaling-group'
              # the jambonz secrets (see SsmSecrets): the feature servers reads common and fs
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParametersByPath'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/common'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/common/*'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/fs'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/fs/*'

  # --- Feature server EC2 Role Instance profile
  FeatureServerInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      InstanceProfileName:  !Sub '${AWS::StackName}-feature-server-ec2-role'
      Path: /
      Roles:
        - !Ref FeatureServerIamRole

  FeatureServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only: a customer-reachable SSRF (webhook, bucket endpoint) can then
        # never read the instance role's credentials from 169.254.169.254.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        ImageId: !FindInMap [ "Arch2AMI", !Ref Architecture, "FsAmi"]
        InstanceType: !If
          - UseDefaultFeatureServerInstanceType
          - !FindInMap [ArchInstanceTypeDefaults, !Ref Architecture, FeatureServerDefault]
          - !Ref InstanceTypeFeatureServer
        Placement:
          GroupName: !Ref MyPlacementGroup
        IamInstanceProfile:
          Name: !Ref FeatureServerInstanceProfile
        KeyName: !Ref KeyName
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            Groups:
              - Ref: SshSecurityGroup
              - Ref: FeatureServerSecurityGroup
            DeviceIndex: 0
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Encrypted: !If [EnableEBSEncryptionCondition, true, false]
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash -e
                #
                # Cache a bucket name on this host
                echo "running jambonz user data script"

                # Detecting the Linux distribution
                if grep -q 'ID="rhel"' /etc/os-release; then
                    DEFAULT_USER=ec2-user

                    echo disabling firewalld
                    sudo systemctl stop firewalld
                    sudo systemctl disable firewalld
                else
                    DEFAULT_USER=admin
                fi

                # Always use jambonz user for apps
                USER=jambonz
                HOME=/home/jambonz

                # Sync SSH keys from default user to jambonz user
                echo "Syncing SSH keys to jambonz user..."
                if [ -f "/home/$DEFAULT_USER/.ssh/authorized_keys" ] && [ -s "/home/$DEFAULT_USER/.ssh/authorized_keys" ]; then
                    mkdir -p /home/jambonz/.ssh
                    cp "/home/$DEFAULT_USER/.ssh/authorized_keys" /home/jambonz/.ssh/
                    chown -R jambonz:jambonz /home/jambonz/.ssh
                    chmod 700 /home/jambonz/.ssh
                    chmod 600 /home/jambonz/.ssh/authorized_keys
                    echo "SSH keys copied from $DEFAULT_USER to jambonz"
                else
                    echo "Warning: No SSH keys found for $DEFAULT_USER"
                fi

                # configure mediajam media server (replaces freeswitch)
                # mediajam doesn't use MySQL; redis is for the license loader.
                sudo sed -i -e "s|^KRISP_API_KEY=.*|KRISP_API_KEY=${KrispApiKey}|" /etc/default/mediajam
                sudo sed -i -e "s|^#\?JAMBONES_REDIS_HOST=.*|JAMBONES_REDIS_HOST=${JAMBONES_REDIS_HOST}|" /etc/default/mediajam
                sudo sed -i -e "s|^#\?JAMBONES_REDIS_PORT=.*|JAMBONES_REDIS_PORT=6379|" /etc/default/mediajam

                sudo systemctl daemon-reload
                sudo systemctl restart mediajam

                # Set OTEL_ENABLED based on EnableOpenTelemetry parameter
                if [[ "${EnableOpenTelemetry}" == "true" ]]; then
                  OTEL_ENABLED=1
                else
                  OTEL_ENABLED=0
                fi

                echo "writing $HOME/apps/ecosystem.config.js.."

                cat << EOF > $HOME/apps/ecosystem.config.js
                module.exports = {
                apps : [
                {
                    name: 'feature-server',
                    cwd: '$HOME/apps/feature-server',
                    script: 'app.js',
                    instance_var: 'INSTANCE_ID',
                    out_file: '$HOME/.pm2/logs/feature-server.log',
                    err_file: '$HOME/.pm2/logs/feature-server.log',
                    exec_mode: 'fork',
                    instances: 'max',
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '5G',
                    node_args: [],
                    env: {
                      JAMBONES_LOGLEVEL: 'info',
                      JAMBONES_TTS_TRIM_SILENCE: 1,
                      AWS_REGION: '${AWS_REGION}',
                      JAMBONES_API_BASE_URL: 'http://${URLPortal}/v1',
                      ENABLE_METRICS: 1,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_TELEGRAF: 1,
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      JAMBONES_OTEL_ENABLED: $OTEL_ENABLED,
                      OTEL_EXPORTER_JAEGER_ENDPOINT: 'http://${MONITORING_SERVER_IP}:14268/api/traces',
                      OTEL_EXPORTER_OTLP_METRICS_INSECURE: 1,
                      OTEL_EXPORTER_JAEGER_GRPC_INSECURE: 1,
                      AWS_LIFECYCLE_DRAIN: 1,
                      JAMBONES_NETWORK_CIDR: '${VPC_CIDR}',
                      JAMBONES_MYSQL_REFRESH_TTL: ${DbCachingTTS},
                      JAMBONES_MYSQL_HOST: '${JAMBONES_MYSQL_HOST}',
                      JAMBONES_MYSQL_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_DATABASE: 'jambones',
                      JAMBONES_MYSQL_CONNECTION_LIMIT: 10,
                      JAMBONES_REDIS_HOST: '${JAMBONES_REDIS_HOST}',
                      JAMBONES_REDIS_PORT: 6379,
                      JAMBONES_TIME_SERIES_HOST: '${JAMBONES_TIME_SERIES_HOST}',
                      HTTP_PORT: 3000,
                      HTTP_PORT_MAX: 3009,
                      DRACHTIO_HOST: '127.0.0.1',
                      DRACHTIO_PORT: 9022,
                      DRACHTIO_SECRET: 'cymru',
                      JAMBONES_FEATURE_SERVERS: '127.0.0.1:9022:cymru',
                      JAMBONES_MEDIAJAM: '127.0.0.1:8021',
                      JAMBONZ_RECORD_WS_USERNAME: 'jambonz',
                      JAMBONZ_RECORD_WS_BASE_URL: '${RecordingWsBaseUrl}'
                    }
                  }]
                };
                EOF
              
                echo "finished writing config file"

                # the feature server's secrets come from Parameter Store at every start (ssm-env preload)
                sudo /opt/jambonz/apply-ssm-secrets.sh "/jambonz/${AWS::StackName}/common,/jambonz/${AWS::StackName}/fs" ${AWS_REGION} \
                  $HOME/apps/ecosystem.config.js "JWT_SECRET ENCRYPTION_SECRET AUTHENTICATION_KEY JAMBONES_MYSQL_PASSWORD JAMBONZ_RECORD_WS_PASSWORD"

                sudo -u $USER bash -c "pm2 start $HOME/apps/ecosystem.config.js"
                sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
                sudo -u $USER bash -c "pm2 save"
                sudo systemctl enable pm2-$USER.service

                # point telegraf at the monitoring server's InfluxDB
                echo "JAMBONES_INFLUX_URL=http://${MONITORING_SERVER_IP}:8086" | sudo tee -a /etc/default/telegraf > /dev/null
                sudo systemctl restart telegraf

                # enable cloudwatch
                if [[ ${CloudwatchLogRetention} -ne 0 ]]; then
                  echo "Enabling Cloudwatch for jambonz logs"
                  sudo sed -i -e "s/retention_in_days\": 3/retention_in_days\": ${CloudwatchLogRetention}/g" /opt/aws/amazon-cloudwatch-agent/bin/config.json 
                  sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json
                else
                  echo "Cloudwatch log retention is set to 0, disabling cloudwatch setup"
                  sudo systemctl stop amazon-cloudwatch-agent
                  sudo systemctl disable amazon-cloudwatch-agent
                fi

                echo "user data script completed"
              - VPC_CIDR: !Ref VpcCidr
                JAMBONES_MYSQL_HOST: !GetAtt DatabaseCluster.ReadEndpoint.Address
                JAMBONES_MYSQL_USER: !Ref MySQLUsername
                JAMBONES_REDIS_HOST: !GetAtt ElastiCacheCluster.RedisEndpoint.Address
                AWS_REGION: !Ref AWS::Region
                JAMBONES_SAMPLE_RATE: !Ref StatsSampleRate
                MONITORING_SERVER_IP: !GetAtt MonitoringServerEC2.PrivateIp
                URLPortal: !Ref URLPortal
                JAMBONES_TIME_SERIES_HOST: !GetAtt MonitoringServerEC2.PrivateIp
                CloudwatchLogRetention: !If [ShouldEnableCloudWatch, !Ref CloudwatchLogRetention, 0]
                DbCachingTTS: !Ref DbCachingTTS
                KrispApiKey: !Ref KrispApiKey
                EnableOpenTelemetry: !Ref EnableOpenTelemetry
                RecordingWsBaseUrl: !Sub "ws://${RecordingApplicationLoadBalancer.DNSName}"

  FeatureServerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - DatabaseInstance 
      - ElastiCacheCluster
      - SsmSecrets
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-feature-server-autoscaling-group'
      LaunchTemplate:
        LaunchTemplateId: !Ref FeatureServerLaunchTemplate
        Version: !GetAtt FeatureServerLaunchTemplate.LatestVersionNumber
      MinSize: 0
      MaxSize: 8
      DesiredCapacity: 1
      TerminationPolicies:
      - OldestInstance
      VPCZoneIdentifier: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - 
          Key: Name
          Value: !Sub '${AWS::StackName}-feature-server'
          PropagateAtLaunch: 'true'

  FeatureServerLifecycleHook: 
    Type: AWS::AutoScaling::LifecycleHook
    Properties:
      LifecycleHookName: !Sub '${AWS::StackName}-fs-scale-in'
      AutoScalingGroupName: !Ref FeatureServerAutoScalingGroup
      LifecycleTransition: "autoscaling:EC2_INSTANCE_TERMINATING"


###########################################
#
#      SBC RTP Instance
#
###########################################
  SbcRtpEIP1:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        -
          Key: Environment
          Value: !Sub '${AWS::StackName}-sbc-rtp'
        -
          Key: Name
          Value: !Sub '${AWS::StackName}-sbc-rtp-1'


 # --- Feature server EC2 IAM role
  SbcRtpServerIamRole:
    Type: AWS::IAM::Role
    Properties:
      Description: jambonz SBC RTP servers
      RoleName: !Sub '${AWS::StackName}-sbc-rtp-ec2-role'
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [ec2.amazonaws.com]
          Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - !Ref InstanceAgentPolicy
      Policies:
        - PolicyName: jambonz
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # scale-in drain (sbc-rtpengine-sidecar): finds its own ASG and terminate hook at startup and
              # completes the hook once its calls have ended. Describe actions have no
              # resource-level permissions; DescribeAutoScalingGroups serves the SIGHUP status dump.
              - Effect: Allow
                Action:
                  - 'autoscaling:DescribeAutoScalingInstances'
                  - 'autoscaling:DescribeLifecycleHooks'
                  - 'autoscaling:DescribeAutoScalingGroups'
                Resource: '*'
              - Effect: Allow
                Action: 'autoscaling:CompleteLifecycleAction'
                Resource: !Sub 'arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-sbc-rtp-autoscaling-group'
              # Elastic IP (auto-assign-elastic-ip.sh): claim a free EIP tagged with this tier's
              # Environment. Association is allowed only when the EIP and the instance both carry it.
              - Effect: Allow
                Action: 'ec2:DescribeAddresses'
                Resource: '*'
              - Effect: Allow
                Action: 'ec2:AssociateAddress'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    'aws:ResourceTag/Environment': !Sub '${AWS::StackName}-sbc-rtp'

  # --- SBC RTP EC2 Role Instance profile
  SbcRtpServerInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      InstanceProfileName:  !Sub '${AWS::StackName}-sbc-rtp-ec2-role'
      Path: /
      Roles:
        - !Ref SbcRtpServerIamRole

  SbcRtpLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only: a customer-reachable SSRF (webhook, bucket endpoint) can then
        # never read the instance role's credentials from 169.254.169.254.
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        ImageId: !FindInMap [ "Arch2AMI", !Ref Architecture, "SbcRtpAmi"]
        InstanceType: !If
          - UseDefaultSbcRtpInstanceType
          - !FindInMap [ArchInstanceTypeDefaults, !Ref Architecture, SbcRtpDefault]
          - !Ref InstanceTypeSbcRtp
        Placement:
          GroupName: !Ref MyPlacementGroup
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            Groups:
              - Ref: SshSecurityGroup
              - Ref: SbcRtpSecurityGroup
            DeviceIndex: 0
        IamInstanceProfile:
          Name: !Ref SbcRtpServerInstanceProfile
        KeyName: !Ref KeyName
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Encrypted: !If [EnableEBSEncryptionCondition, true, false]
              DeleteOnTermination: true
        UserData:
          Fn::Base64: 
            Fn::Sub:
              - |
                #!/bin/bash

                echo "running jambonz user data script"

                # Detecting the Linux distribution
                if grep -q 'ID="rhel"' /etc/os-release; then
                    DEFAULT_USER=ec2-user

                    echo disabling firewalld
                    sudo systemctl stop firewalld
                    sudo systemctl disable firewalld
                else
                    DEFAULT_USER=admin
                fi

                # Always use jambonz user for apps
                USER=jambonz
                HOME=/home/jambonz

                # Sync SSH keys from default user to jambonz user
                echo "Syncing SSH keys to jambonz user..."
                if [ -f "/home/$DEFAULT_USER/.ssh/authorized_keys" ] && [ -s "/home/$DEFAULT_USER/.ssh/authorized_keys" ]; then
                    mkdir -p /home/jambonz/.ssh
                    cp "/home/$DEFAULT_USER/.ssh/authorized_keys" /home/jambonz/.ssh/
                    chown -R jambonz:jambonz /home/jambonz/.ssh
                    chmod 700 /home/jambonz/.ssh
                    chmod 600 /home/jambonz/.ssh/authorized_keys
                    echo "SSH keys copied from $DEFAULT_USER to jambonz"
                else
                    echo "Warning: No SSH keys found for $DEFAULT_USER"
                fi

                if [ -f "/usr/local/bin/auto-assign-elastic-ip.sh" ]; then
                    IMDS_TOKEN="$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")"
                    PRE_PUBLIC_IP=`curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4`
                    echo "before retrieving EIP for RTP server, public IP is $PRE_PUBLIC_IP"

                    /usr/local/bin/auto-assign-elastic-ip.sh
                    sleep 20

                    PUBLIC_IP=`curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4`
                    echo "after retrieving EIP for RTP server, public IP is $PUBLIC_IP"
                else
                    echo "Warning: /usr/local/bin/auto-assign-elastic-ip.sh not found, skipping EIP assignment"
                fi

                echo "writing $HOME/apps/ecosystem.config.js.."
                cat << EOF > $HOME/apps/ecosystem.config.js
                module.exports = {
                  apps : [
                  {
                    name: 'sbc-rtpengine-sidecar',
                    cwd: '$HOME/apps/sbc-rtpengine-sidecar',
                    script: 'app.js',
                    instance_var: 'INSTANCE_ID',
                    out_file: '$HOME/.pm2/logs/sbc-rtpengine-sidecar.log',
                    err_file: '$HOME/.pm2/logs/sbc-rtpengine-sidecar.log',
                    merge_logs: true,
                    exec_mode: 'fork',
                    instances: 1,
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '1G',
                    env: {
                      LOGLEVEL: 'info',
                      RTPENGINE_DTMF_LOG_PORT: 22223,
                      AWS_LIFECYCLE_DRAIN: 1,
                      AWS_REGION: '${AWS_REGION}',
                      JAMBONES_REDIS_HOST: '${JAMBONES_REDIS_HOST}',
                      JAMBONES_REDIS_PORT: 6379,
                      ENABLE_METRICS: 1,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      STATS_TELEGRAF: 1
                    }
                  }
                  ]
                };
                EOF
                echo "finished writing config file"
                sudo -u $USER bash -c "pm2 start $HOME/apps/ecosystem.config.js"
                sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
                sudo -u $USER bash -c "pm2 save"
                sudo systemctl enable pm2-$USER.service

                # point telegraf at the monitoring server's InfluxDB
                echo "JAMBONES_INFLUX_URL=http://${MONITORING_SERVER_IP}:8086" | sudo tee -a /etc/default/telegraf > /dev/null
                sudo systemctl restart telegraf

                # point rtpengine to the HEP endpoint on the monitoring server
                if [[ "${EnablePcaps}" == "true" ]]; then
                  sudo sed -i -e "s/--delete-delay 0/--delete-delay 0 --homer=${MONITORING_SERVER_IP}:9060 --homer-protocol=udp --homer-id=11/g"  /etc/systemd/system/rtpengine.service
                  sudo systemctl daemon-reload
                fi
                sudo systemctl restart rtpengine

                echo "user data script completed"

              - VPC_CIDR: !Ref VpcCidr
                AWS_REGION: !Ref AWS::Region
                JAMBONES_MYSQL_HOST: !GetAtt DatabaseCluster.ReadEndpoint.Address
                JAMBONES_MYSQL_USER: !Ref MySQLUsername
                JAMBONES_SAMPLE_RATE: !Ref StatsSampleRate
                JAMBONES_REDIS_HOST: !GetAtt ElastiCacheCluster.RedisEndpoint.Address
                MONITORING_SERVER_IP: !GetAtt MonitoringServerEC2.PrivateIp
                CloudwatchLogRetention: !If [ShouldEnableCloudWatch, !Ref CloudwatchLogRetention, 0]
                EnablePcaps: !Ref EnablePcaps

    
  SbcRtpServerAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - DatabaseInstance 
      - ElastiCacheCluster
      - SbcRtpEIP1
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-sbc-rtp-autoscaling-group'
      LaunchTemplate:
        LaunchTemplateId: !Ref SbcRtpLaunchTemplate
        Version: !GetAtt SbcRtpLaunchTemplate.LatestVersionNumber
      MinSize: 0
      MaxSize: 4
      DesiredCapacity: 1
      TerminationPolicies:
       - OldestInstance
      VPCZoneIdentifier: 
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        -
          Key: Name
          Value: !Sub '${AWS::StackName}-rtp-server'
          PropagateAtLaunch: 'true'
        -
          Key: Environment
          Value: !Sub '${AWS::StackName}-sbc-rtp'
          PropagateAtLaunch: 'true'

  SbcRtpServerLifecycleHook: 
    Type: AWS::AutoScaling::LifecycleHook
    Properties:
      LifecycleHookName: !Sub '${AWS::StackName}-rtp-scale-in'
      AutoScalingGroupName: !Ref SbcRtpServerAutoScalingGroup
      LifecycleTransition: "autoscaling:EC2_INSTANCE_TERMINATING"



###########################################
#
#      WebServer Instance
#
###########################################
  WebServerEIP:
    Type: AWS::EC2::EIP
    Condition: UseSingleWebServer
    DeletionPolicy: Retain
    Properties:
      Domain: vpc
      Tags:
        -
          Key: Name
          Value: !Sub '${AWS::StackName}-webserver'
        -
          Key: Environment
          Value: !Sub '${AWS::StackName}-webserver'

  WebServerEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: UseSingleWebServer
    Properties:
      AllocationId: !GetAtt WebServerEIP.AllocationId
      InstanceId: !Ref WebServerEC2

  # --- Web server EC2 IAM role
  WebServerIamRole:
    Type: AWS::IAM::Role
    Properties:
      Description: jambonz web servers
      RoleName: !Sub '${AWS::StackName}-webserver-ec2-role'
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: [ec2.amazonaws.com]
          Action: ['sts:AssumeRole']
      Path: /
      ManagedPolicyArns:
        - !Ref InstanceAgentPolicy
      Policies:
        - PolicyName: jambonz
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # the jambonz secrets (see SsmSecrets): the web tier reads common
              - Effect: Allow
                Action:
                  - 'ssm:GetParameter'
                  - 'ssm:GetParametersByPath'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/common'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jambonz/${AWS::StackName}/common/*'
              # the portal's per-call log view (api-server recent-calls) reads the feature server log group
              - Effect: Allow
                Action: 'logs:FilterLogEvents'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:jambonz-feature_server:*'
              # behind the ALB the seeding instance takes the initial admin password from here
              - !If
                - UseWebAsg
                - Effect: Allow
                  Action: 'secretsmanager:GetSecretValue'
                  Resource: !Ref WebAdminPasswordSecret
                - !Ref AWS::NoValue

  # --- Webserver EC2 Role Instance profile
  WebServerInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      InstanceProfileName:  !Sub '${AWS::StackName}-webserver-ec2-role'
      Path: /
      Roles:
        - !Ref WebServerIamRole

  # --- Web server launch template, shared by both deployment modes:
  #     single-instance launches one EC2 instance from it (with an Elastic IP),
  #     autoscaling-alb launches an Auto Scaling group behind the web ALB
  WebLaunchTemplate:
    DependsOn:
      - DatabaseInstance
      - ElastiCacheCluster
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-webserver-launch-template"
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        IamInstanceProfile:
          Name: !Ref WebServerInstanceProfile
        ImageId: !FindInMap [ "Arch2AMI", !Ref Architecture, "WebserverAmi"]
        InstanceType: !If
          - UseDefaultWebserverInstanceType
          - !FindInMap [ArchInstanceTypeDefaults, !Ref Architecture, WebserverDefault]
          - !Ref InstanceTypeWebserver
        SecurityGroupIds:
          - !Ref SshSecurityGroup
          - !Ref WebserverSecurityGroup
        KeyName: !Ref KeyName
        Monitoring:
          Enabled: true
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Encrypted: !If [EnableEBSEncryptionCondition, true, false]
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash -xe

                echo "running jambonz user data script"

                # The database password is needed here only to seed or migrate the schema.
                # Read it with tracing off (-x would copy it into cloud-init-output.log and
                # the EC2 console log) and hand it to mysql and the db scripts through the
                # environment, never on a command line.
                set +x
                MYSQL_PWD=$(aws ssm get-parameter --region ${AWS_REGION} --with-decryption \
                  --name /jambonz/${AWS::StackName}/common/JAMBONES_MYSQL_PASSWORD --query Parameter.Value --output text)
                export MYSQL_PWD JAMBONES_MYSQL_PASSWORD="$MYSQL_PWD"
                set -x

                # Detecting the Linux distribution
                if grep -q 'ID="rhel"' /etc/os-release; then
                    DEFAULT_USER=ec2-user
                    NGINX_CONFIG=/etc/nginx/conf.d/default.conf

                    echo restarting postgresql
                    systemctl restart postgresql-12

                    echo disabling firewalld
                    sudo systemctl stop firewalld
                    sudo systemctl disable firewalld
                else
                    DEFAULT_USER=admin
                    NGINX_CONFIG=/etc/nginx/sites-available/default
                fi

                # Always use jambonz user for apps
                USER=jambonz
                HOME=/home/jambonz

                # Sync SSH keys from default user to jambonz user
                echo "Syncing SSH keys to jambonz user..."
                if [ -f "/home/$DEFAULT_USER/.ssh/authorized_keys" ] && [ -s "/home/$DEFAULT_USER/.ssh/authorized_keys" ]; then
                    mkdir -p /home/jambonz/.ssh
                    cp "/home/$DEFAULT_USER/.ssh/authorized_keys" /home/jambonz/.ssh/
                    chown -R jambonz:jambonz /home/jambonz/.ssh
                    chmod 700 /home/jambonz/.ssh
                    chmod 600 /home/jambonz/.ssh/authorized_keys
                    echo "SSH keys copied from $DEFAULT_USER to jambonz"
                else
                    echo "Warning: No SSH keys found for $DEFAULT_USER"
                fi

                # EIP is assigned via CloudFormation EIPAssociation, no need to run auto-assign script
                IMDS_TOKEN="$(curl -s -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")"
                PUBLIC_IP=`curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4`
                echo "webserver public IP is $PUBLIC_IP"

                echo "running jambonz web and monitoring server user data script"

                INSTANCE_ID="$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id)"

                # initial admin password: the instance id of a standalone web server; an
                # autoscaling web tier has no single instance id to report in the stack
                # outputs, so it uses a generated secret instead (read with tracing off, as above)
                set +x
                if [[ "${WEB_ASG}" == "true" ]]; then
                  JAMBONES_ADMIN_INITIAL_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "${ADMIN_PASSWORD_SECRET_ARN}" --region ${AWS_REGION} --query 'SecretString' --output text)
                else
                  JAMBONES_ADMIN_INITIAL_PASSWORD=$INSTANCE_ID
                fi
                export JAMBONES_ADMIN_INITIAL_PASSWORD
                set -x

                # check if database already has tables (i.e. not a fresh deployment)
                TABLE_COUNT=$(mysql -h ${JAMBONES_MYSQL_HOST} -u admin -D jambones -sN -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='jambones'")

                if [ "$TABLE_COUNT" -eq 0 ]; then
                  echo "seeding database (first-time deployment).."
                  DEFAULT_ACCOUNT_SID=$(uuidgen)
                  DEFAULT_TOKEN=$(uuidgen)
                  sudo sed -i "s/9351f46a-678c-43f5-b8a6-d4eb58d131af/$DEFAULT_ACCOUNT_SID/g" $HOME/apps/api-server/db/seed-production-database-open-source.sql
                  sudo sed -i "s/38700987-c7a4-4685-a5bb-af378f9734de/$DEFAULT_TOKEN/g" $HOME/apps/api-server/db/seed-production-database-open-source.sql
                  mysql -h ${JAMBONES_MYSQL_HOST} -u admin -D jambones < $HOME/apps/api-server/db/jambones-sql.sql
                  sudo sed -i 's/public-apps.jambonz.cloud/public-apps.${URLPortal}/g' $HOME/apps/api-server/db/seed-production-database-open-source.sql
                  mysql -h ${JAMBONES_MYSQL_HOST} -u admin -D jambones < $HOME/apps/api-server/db/seed-production-database-open-source.sql
                  JAMBONES_MYSQL_HOST=${JAMBONES_MYSQL_HOST} JAMBONES_MYSQL_USER=admin JAMBONES_MYSQL_DATABASE=jambones $HOME/apps/api-server/db/reset_admin_password.js

                  # add row to system information table
                  mysql -h ${JAMBONES_MYSQL_HOST} -u admin -D jambones -e $'insert into system_information (domain_name, sip_domain_name, monitoring_domain_name) values ('\'''"${URLPortal}"''\'', '\''sip.'"${URLPortal}"''\'', '\''grafana.'"${URLPortal}"''\'')'

                  # record the schema version so upgrade-jambonz-db.js knows the DB is initialized
                  SCHEMA_VERSION=$(node -p "require('$HOME/apps/api-server/package.json').version")
                  echo "Setting schema_version to $SCHEMA_VERSION"
                  mysql -h ${JAMBONES_MYSQL_HOST} -u admin -D jambones -e "INSERT INTO schema_version (version) VALUES ('$SCHEMA_VERSION')"
                else
                  echo "database already exists, running migrations.."
                  JAMBONES_MYSQL_HOST=${JAMBONES_MYSQL_HOST} JAMBONES_MYSQL_USER=admin JAMBONES_MYSQL_DATABASE=jambones node $HOME/apps/api-server/db/upgrade-jambonz-db.js
                fi

                # jambonz webapp
                echo "configuring webapp.."
                echo "VITE_API_BASE_URL=${WEB_SCHEME}://${URLPortal}/api/v1" > $HOME/apps/webapp/.env
                API_BASE_URL=${WEB_SCHEME}://${URLPortal}/api/v1 TAG="<script>window.JAMBONZ = { API_BASE_URL: '$API_BASE_URL'};</script>"
                sed -i -e "\@</head>@i\ $TAG" $HOME/apps/webapp/dist/index.html

                echo "writing $HOME/apps/ecosystem.config.js.."
                cat << EOF > $HOME/apps/ecosystem.config.js
                module.exports = {
                  apps : [
                  {
                    name: 'api-server',
                    cwd: '$HOME/apps/api-server',
                    script: 'app.js',
                    out_file: '$HOME/.pm2/logs/api-server.log',
                    err_file: '$HOME/.pm2/logs/api-server.log',
                    combine_logs: true,
                    instance_var: 'INSTANCE_ID',
                    exec_mode: 'cluster',
                    instances: 0,
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '5G',
                    node_args: [],
                    env: {
                      JAMBONES_LOGLEVEL: 'info',
                      AWS_REGION: '${AWS_REGION}',
                      JAMBONES_MYSQL_REFRESH_TTL: ${DbCachingTTS},
                      JAMBONES_MYSQL_HOST: '${JAMBONES_MYSQL_HOST}',
                      JAMBONES_MYSQL_USER: '${JAMBONES_MYSQL_USER}',
                      JAMBONES_MYSQL_DATABASE: 'jambones',
                      JAMBONES_MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT},
                      JAMBONES_REDIS_HOST: '${JAMBONES_REDIS_HOST}',
                      JAMBONES_REDIS_PORT: 6379,
                      JAMBONE_API_VERSION: 'v1',
                      JAMBONES_TIME_SERIES_HOST: '${JAMBONES_TIME_SERIES_HOST}',
                      ENABLE_METRICS: 1,
                      STATS_HOST: '127.0.0.1',
                      STATS_PORT: 8125,
                      STATS_PROTOCOL: 'tcp',
                      STATS_TELEGRAF: 1,
                      STATS_SAMPLE_RATE: ${JAMBONES_SAMPLE_RATE},
                      HTTP_PORT:  3000,
                      JAMBONES_TRUST_PROXY: 1,
                      JAEGER_BASE_URL: 'http://${MONITORING_SERVER_IP}:16686',
                      HOMER_BASE_URL: 'http://${MONITORING_SERVER_IP}:9080',
                      HOMER_USERNAME: 'admin',
                      HOMER_PASSWORD: 'sipcapture',
                      JAMBONZ_UPDATE_CLIENT_TOKEN: '__JAMBONZ_UPDATE_CLIENT_TOKEN__',
                      JAMBONZ_UPDATE_CLIENT_URL: 'http://127.0.0.1:3201'
                      },
                  },
                  {
                    name: 'webapp',
                    script: 'npm',
                    cwd: '$HOME/apps/webapp',
                    args: 'run serve'
                  },
                  {
                    name: 'public-apps',
                    cwd: '$HOME/apps/public-apps',
                    script: 'app.js',
                    out_file: '$HOME/.pm2/logs/public-apps',
                    err_file: '$HOME/.pm2/logs/public-apps',
                    combine_logs: true,
                    instance_var: 'INSTANCE_ID',
                    exec_mode: 'fork',
                    instances: 1,
                    autorestart: true,
                    watch: false,
                    max_memory_restart: '1G',
                    env: {
                      LOGLEVEL: 'info',
                      NRC_TIME_SERVICE_DID: '+16137451576'
                    }
                  }]
                };
                EOF
              
                echo "finished writing config file"

                echo "building api-server"
                sudo -u $USER bash -c "cd $HOME/apps/api-server && npm ci"
                unset MYSQL_PWD JAMBONES_MYSQL_PASSWORD JAMBONES_ADMIN_INITIAL_PASSWORD

                # the api-server's secrets come from Parameter Store at every start (ssm-env preload)
                sudo /opt/jambonz/apply-ssm-secrets.sh "/jambonz/${AWS::StackName}/common" ${AWS_REGION} \
                  $HOME/apps/ecosystem.config.js "JWT_SECRET ENCRYPTION_SECRET AUTHENTICATION_KEY JAMBONES_MYSQL_PASSWORD"

                sudo -u $USER bash -c "pm2 start $HOME/apps/ecosystem.config.js"
                sudo env PATH=$PATH:/usr/bin /usr/lib/node_modules/pm2/bin/pm2 startup systemd -u $USER --hp $HOME
                sudo -u $USER bash -c "pm2 save"
                sudo systemctl enable pm2-$USER.service
              
                # point telegraf at the monitoring server's InfluxDB
                echo "JAMBONES_INFLUX_URL=http://${MONITORING_SERVER_IP}:8086" | sudo tee -a /etc/default/telegraf > /dev/null
                sudo systemctl restart telegraf
                                          
                # nginx is the one proxy hop the api-server trusts (JAMBONES_TRUST_PROXY=1).
                # It replaces X-Forwarded-For with the client address: taken from the
                # load balancer's X-Forwarded-For when the request comes from inside the
                # VPC, and from the socket otherwise, so internet clients cannot spoof it
                sudo cat << EOF > /etc/nginx/sites-available/default 
                set_real_ip_from ${VPC_CIDR};
                real_ip_header X-Forwarded-For;
                real_ip_recursive on;
                server {
                    listen 80;
                    server_name ${URLPortal};
                    location /api/ {
                        rewrite ^/api/(.*)$ /\$1 break;
                        proxy_pass http://localhost:3000;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Forwarded-For \$remote_addr;
                    }
                    location / {
                        proxy_pass http://localhost:3001;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Forwarded-For \$remote_addr;
                    }
                }
                server {
                    listen 80;
                    server_name api.${URLPortal};
                    location / {
                        proxy_pass http://localhost:3000;
                        proxy_set_header Host \$host;
                        proxy_set_header X-Forwarded-For \$remote_addr;
                    }
                }
                server {
                  listen 80;
                  server_name grafana.${URLPortal}; 
                  location / {
                    proxy_pass http://${MONITORING_SERVER_IP}:3010; 
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Forwarded-For \$remote_addr;
                    proxy_cache_bypass \$http_upgrade;
                  }
                }
                server {
                  listen 80;
                  server_name public-apps.${URLPortal}; 
                  location / {
                    proxy_pass http://localhost:3010; 
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_set_header X-Forwarded-For \$remote_addr;
                    proxy_cache_bypass \$http_upgrade;
                  }
                }
                EOF

                sudo systemctl restart nginx

                  # enable cloudwatch
                  if [[ ${CloudwatchLogRetention} -ne 0 ]]; then
                    echo "Enabling Cloudwatch for jambonz logs"
                    sudo sed -i -e "s/retention_in_days\": 3/retention_in_days\": ${CloudwatchLogRetention}/g" /opt/aws/amazon-cloudwatch-agent/bin/config.json 
                    sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json
                  else
                    echo "Cloudwatch log retention is set to 0, disabling cloudwatch setup"
                    sudo systemctl stop amazon-cloudwatch-agent
                    sudo systemctl disable amazon-cloudwatch-agent
                  fi

                echo "webserver user data script completed"
              - VPC_CIDR: !Ref VpcCidr
                JAMBONES_MYSQL_HOST: !GetAtt DatabaseCluster.Endpoint.Address
                JAMBONES_MYSQL_USER: !Ref MySQLUsername
                JAMBONES_REDIS_HOST: !GetAtt ElastiCacheCluster.RedisEndpoint.Address
                JAMBONES_SAMPLE_RATE: !Ref StatsSampleRate
                MONITORING_SERVER_IP:  !GetAtt MonitoringServerEC2.PrivateIp
                AWS_REGION: !Ref AWS::Region
                JAMBONES_TIME_SERIES_HOST: !GetAtt MonitoringServerEC2.PrivateIp
                URLPortal: !Ref URLPortal
                CloudwatchLogRetention: !If [ShouldEnableCloudWatch, !Ref CloudwatchLogRetention, 0]
                DbCachingTTS: !Ref DbCachingTTS
                WEB_ASG: !If [UseWebAsg, "true", "false"]
                WEB_SCHEME: !If [UseWebAsg, https, http]
                ADMIN_PASSWORD_SECRET_ARN: !If [UseWebAsg, !Ref WebAdminPasswordSecret, ""]
                # fewer connections per process: an autoscaling tier multiplies them by
                # instance count (x pm2 workers)
                MYSQL_CONNECTION_LIMIT: !If [UseWebAsg, 5, 10]

  WebServerEC2:
    Type: 'AWS::EC2::Instance'
    Condition: UseSingleWebServer
    DependsOn: SsmSecrets
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-webserver'
        - Key: Environment
          Value: !Sub '${AWS::StackName}-webserver'

  # --- Autoscaling web tier (WebServerDeployment=autoscaling-alb)
  WebAdminPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseWebAsg
    Properties:
      Name: !Sub "${AWS::StackName}-web-admin-initial-password"
      Description: "Initial password for the jambonz portal admin user; you are forced to change it on first login."
      GenerateSecretString:
        PasswordLength: 16
        ExcludeCharacters: "/?%,; \\[]&'\"$`"
        IncludeSpace: false

  WebAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseWebAsg
    Properties:
      GroupName: !Sub '${AWS::StackName}-web-alb-sg'
      GroupDescription: !Sub 'Security group for ${AWS::StackName} web load balancer'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
          Description: Allow HTTP access (redirected to HTTPS)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedHttpCidr
          Description: Allow HTTPS access
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web-alb-sg'

  WebApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: UseWebAsg
    Properties:
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref WebAlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-alb"

  # targets are nginx on :80; /api/health reaches the api-server's /health,
  # which fails when the instance cannot reach mysql or redis
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: UseWebAsg
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web-tg"

  WebHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseWebAsg
    Properties:
      LoadBalancerArn: !Ref WebApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref WebCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  WebHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseWebAsg
    Properties:
      LoadBalancerArn: !Ref WebApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # DesiredCapacity is deliberately not set: it starts at MinSize (1) and is
  # then owned by the scaling policy, rather than reset to 1 by every stack update.
  # Rolling updates replace one instance at a time and wait out the boot (npm ci,
  # migrations) before taking down the next, so one instance always serves.
  WebAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Condition: UseWebAsg
    DependsOn: SsmSecrets
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-webserver-asg"
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      MinSize: 1
      MaxSize: 4
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900
      TargetGroupARNs:
        - !Ref WebTargetGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-webserver'
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Sub '${AWS::StackName}-webserver'
          PropagateAtLaunch: true

  WebCpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Condition: UseWebAsg
    Properties:
      AutoScalingGroupName: !Ref WebAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 900
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60

Outputs: 
  WebPortalURL:
    Description: jambonz portal URL, log in with admin/admin and change password
    Value: !Join [ "", [ !If [UseWebAsg, "https://", "http://"], !Ref "URLPortal" ] ]
    Export:
      Name: !Sub '${AWS::StackName}-webserver-url'
  
  WebPortalUsername:
    Value: admin
    Description: Login username for the jambonz portal

  WebPortalPassword:
    Value: !If
      - UseWebAsg
      - !Sub "stored in Secrets Manager as ${AWS::StackName}-web-admin-initial-password"
      - !Ref WebServerEC2
    Description: Initial password for jambonz portal; you will be forced to change it on first login.

  GrafanaUsername:
    Value: admin
    Description: Login username for the grafana portal

  GrafanaPassword:
    Value: admin
    Description: Initial password for grafana portal; you will be forced to change it on first login.

  WebServerIP:
    Condition: UseSingleWebServer
    Value: !GetAtt 
      - WebServerEIP
      - PublicIp
    Description: Webserver IP address - create a DNS record for this domain as well as subdomains grafana, homer, and jaeger

  WebLoadBalancerDnsName:
    Condition: UseWebAsg
    Value: !GetAtt WebApplicationLoadBalancer.DNSName
    Description: Web load balancer DNS name - point the portal domain (Route 53 alias, or CNAME if it is a subdomain) and its api, grafana and public-apps subdomains (CNAME) at this name

  SipServerIP:
    Value: !GetAtt
      - SbcSipEIP1
      - PublicIp
    Description: SBC SIP IP address

  RtpServerIP:
    Value: !GetAtt
      - SbcRtpEIP1
      - PublicIp
    Description: SBC RTP IP address

  VPC: 
    Description: "A reference to the created VPC"
    Value: !Ref "VPC"
    Export:
      Name: !Sub "${AWS::StackName}-VPC"

  SelfiepopVpcCidr:
    Description: "A reference to the created VPC/CIDR"
    Value: !Ref "VpcCidr"
    Export:
      Name: !Sub "${AWS::StackName}-SelfiepopVpcCidr"

  PublicSubnets:
    Description: "A list of the public subnets"
    Value: !Join [ ",", [ !Ref "PublicSubnet1", !Ref "PublicSubnet2" ]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnets"

  PublicSubnet1:
    Description: "A reference to the public subnet in the 1st Availability Zone"
    Value: !Ref "PublicSubnet1"
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1"

  PublicSubnet2:
    Description: "A reference to the public subnet in the 2nd Availability Zone"
    Value: !Ref "PublicSubnet2"
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2"

  RecordingLoadBalancerDnsName:
      Description: DNS name of the Recording Server Application Load Balancer
      Value: !GetAtt RecordingApplicationLoadBalancer.DNSName
      Export:
        Name: !Sub "${AWS::StackName}-recording-lb-dns"
